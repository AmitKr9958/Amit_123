[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "naukri-apply"
version = "0.1.0"
description = "Local-first, supervised Naukri.com job application assistant with relevance scoring and tracking"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amit Kumar" }]
dependencies = [
    "playwright>=1.40.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "sqlite-utils>=3.35",
    "rich>=13.0",
    "tenacity>=8.2",
    "pydantic>=2.5",
    "httpx>=0.27",
]

[project.optional-dependencies]
ai = [
    "openai>=1.40",
    "google-generativeai>=0.8",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
naukri-apply = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"
